  ### Tests

  unit:
    build:
      context: ./
    command: bash -c 'yarn test:unit'

  unit-dep:
    build:
      context: ./
    environment:
      MONGO_DB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/db-aragon?replicaSet=rs0&authSource=admin
      RABBITMQ_URI: amqp://user:password@rabbitmq:5672
      SERVICES_ARAGON_API_BASE_URL: http://service-aragon-api:4000
    depends_on:
      mongo1:
        condition: service_started
      mongo2:
        condition: service_started
      mongo3:
        condition: service_started
      mongo-init-replica:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    env_file:
      - ./test/test.env
    command: bash -c 'yarn wait:db & yarn wait:rabbitmq & wait && yarn test:unit-dep'


  ### Dependencies

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

  mongo1:
    image: mongo:8.0
    container_name: mongo1
    hostname: mongo1
    command: [ "mongod", "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db

  mongo2:
    image: mongo:8.0
    container_name: mongo2
    hostname: mongo2
    command: [ "mongod", "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db

  mongo3:
    image: mongo:8.0
    container_name: mongo3
    hostname: mongo3
    command: [ "mongod", "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db

  mongo-init-replica:
    image: mongo:8.0
    container_name: mongo-init-replica
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    command:
      - /bin/bash
      - -c
      - |
        echo 'Waiting for MongoDB nodes to be ready...'
        for i in $$(seq 1 60); do
          mongosh --host mongo1:27017 --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1 && break
          echo "Mongo not ready yet (attempt $$i/60)..."
          sleep 2
        done

        echo 'Ensuring replica set is initialized...'
        mongosh --host mongo1:27017 --quiet --eval '
          try {
            const status = rs.status();
            if (status.ok === 1) {
              print("Replica set already initialized.");
              quit(0);
            }
          } catch (e) {}

          rs.initiate({
            _id: "rs0",
            members: [
              { _id: 0, host: "mongo1:27017" },
              { _id: 1, host: "mongo2:27017" },
              { _id: 2, host: "mongo3:27017" }
            ]
          });
          print("Replica set initialized.");
        '
        echo 'Mongo replica init finished.'

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
