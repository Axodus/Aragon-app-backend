
services:
  ### =========================
  ### Core Services
  ### =========================

  service-aragon-api:
    build:
      context: ./
    ports:
      - ${SERVICE_API_PORT:-4000}:${SERVICE_API_PORT:-4000}
    environment:
      SERVICES_ARAGON_API_PORT: ${SERVICE_API_PORT:-4000}
      MONGO_DB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/db-aragon?replicaSet=rs0&authSource=admin
      RABBITMQ_URI: amqp://user:password@rabbitmq:5672
      SERVICES_ARAGON_API_BASE_URL: http://service-aragon-api:4000
    depends_on:
      - mongo-init-replica
      - rabbitmq
    command: >
      bash -c "
      yarn wait:db:local &&
      yarn wait:rabbitmq:local &&
      yarn service:aragon-api
      "

  service-aragon-indexer:
    build:
      context: ./
    environment:
      MONGO_DB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/db-aragon?replicaSet=rs0&authSource=admin
      RABBITMQ_URI: amqp://user:password@rabbitmq:5672
      SERVICES_ARAGON_API_BASE_URL: http://service-aragon-api:4000
      NODES_HARMONY_MAINNET_FROM_BLOCK: ${NODES_HARMONY_MAINNET_FROM_BLOCK:-82187187}
      NODES_HARMONY_TESTNET_FROM_BLOCK: ${NODES_HARMONY_TESTNET_FROM_BLOCK:-52100000}
    depends_on:
      - mongo-init-replica
      - rabbitmq
    command: >
      bash -c "
      yarn wait:db:local &&
      yarn service:aragon-indexer
      "

  service-aragon-dao:
    build:
      context: ./
    environment:
      MONGO_DB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/db-aragon?replicaSet=rs0&authSource=admin
      RABBITMQ_URI: amqp://user:password@rabbitmq:5672
      SERVICES_ARAGON_API_BASE_URL: http://service-aragon-api:4000
    depends_on:
      - mongo-init-replica
      - rabbitmq
    command: >
      bash -c "
      yarn wait:db:local &&
      yarn wait:rabbitmq:local &&
      yarn service:aragon-dao
      "

  service-aragon-transfers:
    build:
      context: ./
    environment:
      MONGO_DB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/db-aragon?replicaSet=rs0&authSource=admin
      RABBITMQ_URI: amqp://user:password@rabbitmq:5672
      SERVICES_ARAGON_API_BASE_URL: http://service-aragon-api:4000
    depends_on:
      - mongo-init-replica
      - rabbitmq
    command: >
      bash -c "
      yarn wait:db:local &&
      yarn wait:rabbitmq:local &&
      yarn service:aragon-transfers
      "

  service-aragon-gateway:
    build:
      context: ./
    environment:
      MONGO_DB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/db-aragon?replicaSet=rs0&authSource=admin
      RABBITMQ_URI: amqp://user:password@rabbitmq:5672
      SERVICES_ARAGON_API_BASE_URL: http://service-aragon-gateway:4000
    depends_on:
      - mongo-init-replica
      - rabbitmq
    command: >
      bash -c "
      yarn wait:db:local &&
      yarn wait:rabbitmq:local &&
      yarn service:aragon-gateway
      "

  service-aragon-rates:
    build:
      context: ./
    environment:
      MONGO_DB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/db-aragon?replicaSet=rs0&authSource=admin
      RABBITMQ_URI: amqp://user:password@rabbitmq:5672
      SERVICES_ARAGON_API_BASE_URL: http://service-aragon-api:4000
    depends_on:
      - mongo-init-replica
      - rabbitmq
    command: >
      bash -c "
      yarn wait:db:local &&
      yarn service:aragon-rates
      "

  service-aragon-admin-api:
    build:
      context: ./
    ports:
      - ${SERVICE_ADMIN_API_PORT:-4001}:${SERVICE_ADMIN_API_PORT:-4001}
    environment:
      SERVICES_ARAGON_ADMIN_API_PORT: ${SERVICE_ADMIN_API_PORT:-4001}
      MONGO_DB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/db-aragon?replicaSet=rs0&authSource=admin
      RABBITMQ_URI: amqp://user:password@rabbitmq:5672
      SERVICES_ARAGON_API_BASE_URL: http://service-aragon-api:4000
