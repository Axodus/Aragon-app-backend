services:
  ### =========================
  ### Core Services
  ### =========================

  service-aragon-api:
    build:
      context: ./
    container_name: service-api
    ports:
      - "${SERVICE_API_PORT:-4000}:${SERVICE_API_PORT:-4000}"
    environment:
      SERVICES_ARAGON_API_PORT: ${SERVICE_API_PORT:-4000}
      MONGO_DB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/db-aragon?replicaSet=rs0
      RABBITMQ_URI: amqp://user:password@rabbitmq:5672
      SERVICES_ARAGON_API_BASE_URL: http://api:4000
    depends_on:
      - mongo-init-replica
      - rabbitmq
    restart: unless-stopped
    command: >
      bash -c "
      bash scripts/waitUp.sh &&
      bash scripts/waitUp.sh rabbitmq 5672 &&
      yarn service:aragon-api
      "

  service-aragon-indexer:
    build:
      context: ./
    container_name: service-indexer
    environment:
      MONGO_DB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/db-aragon?replicaSet=rs0
      RABBITMQ_URI: amqp://user:password@rabbitmq:5672
      SERVICES_ARAGON_API_BASE_URL: http://api:4000
      NODES_HARMONY_MAINNET_FROM_BLOCK: ${NODES_HARMONY_MAINNET_FROM_BLOCK:-82187187}
      NODES_HARMONY_TESTNET_FROM_BLOCK: ${NODES_HARMONY_TESTNET_FROM_BLOCK:-52100000}
    depends_on:
      - mongo-init-replica
      - rabbitmq
