  service-aragon-plugins:
    build:
      context: ./
    environment:
      MONGO_DB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/db-aragon?replicaSet=rs0&authSource=admin
      RABBITMQ_URI: amqp://user:password@rabbitmq:5672
      SERVICES_ARAGON_API_BASE_URL: http://service-aragon-api:4000
    depends_on:
      - mongo-init-replica
      - rabbitmq
    command: >
      bash -c "
      yarn wait:db:local &&
      yarn service:aragon-plugins
      "

  ### =========================
  ### Dependencies
  ### =========================

  rabbitmq:
    image: rabbitmq:management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

  mongo1:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db

  mongo2:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db

  mongo3:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db

  mongo-init-replica:
    image: mongo:8.0
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    entrypoint: bash
    command: >
      -c "
      sleep 5 &&
      mongosh --host mongo1:27017 --eval '
        rs.initiate({
          _id: \"rs0\",
          members: [
            { _id: 0, host: \"mongo1:27017\" },
            { _id: 1, host: \"mongo2:27017\" },
            { _id: 2, host: \"mongo3:27017\" }
          ]
        });
      '
      "

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:

