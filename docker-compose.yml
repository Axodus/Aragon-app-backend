services:
  # --------------------------------------------------
  # RabbitMQ
  # --------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.9-management
    container_name: rabbitmq-${ENV_SUFFIX:-local}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - '${RABBITMQ_AMQP_PORT:-5672}:5672'               # AMQP port
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'       # HTTP management UI
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmqctl status" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal-net

  # --------------------------------------------------
  # Migration Service (runs once and exits)
  # --------------------------------------------------
  migration:
    image: service-migration-${ENV_SUFFIX:-local}
    container_name: service-migration-${ENV_SUFFIX:-local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env.aragon-indexer-${ENV_SUFFIX:-local} # Use the same env file as the indexer
        required: false
    depends_on:
      - rabbitmq
    command: bash -c "yarn wait:rabbitmq && yarn mig:run && echo 'Migration Service completed'"
    restart: "no"  # Don't restart after completion
    networks:
      - internal-net

  # --------------------------------------------------
  # Microservices
  # --------------------------------------------------
  service-aragon-api:
    image: service-aragon-api-${ENV_SUFFIX:-local}
    container_name: service-aragon-api-${ENV_SUFFIX:-local}
    build:
      context: .
    ports:
      # Axodus Governance API consumed by AxodusAPP /governance-api proxy.
      - '${SERVICES_API_PORT:-4002}:4002'
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      NODE_ENV: ${NODE_ENV:-production}
      SERVICES_ARAGON_API_PORT: ${SERVICES_ARAGON_API_PORT:-4002}
      SERVICES_ARAGON_API_BASE_URL: ${SERVICES_ARAGON_API_BASE_URL:-http://localhost:4002}
      # Bootstrap mode exposes public/static endpoints such as /registry/chains
      # without requiring MongoDB/RabbitMQ. Set false when running the full indexer stack.
      SERVICES_ARAGON_API_SKIP_CONNECTIONS: ${SERVICES_ARAGON_API_SKIP_CONNECTIONS:-true}
      SUPPORTED_NETWORKS: ${SUPPORTED_NETWORKS:-ethereum-sepolia,ethereum-mainnet,base-mainnet,arbitrum-mainnet,polygon-mainnet,harmony-mainnet}
    command: >
      bash -c "if [ \"$$SERVICES_ARAGON_API_SKIP_CONNECTIONS\" = \"true\" ];
      then yarn service:aragon-api;
      else yarn wait:rabbitmq && yarn service:aragon-api;
      fi"
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:4002/registry/chains || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal-net
      - public-net

  service-aragon-admin-api:
    image: service-aragon-admin-api-${ENV_SUFFIX:-local}
    container_name: service-aragon-admin-api-${ENV_SUFFIX:-local}
    build:
      context: .
    ports:
      # Host port can be overridden via SERVICES_ADMIN_API_PORT
      - '${SERVICES_ADMIN_API_PORT:-4001}:4001'
    env_file:
      - path: .env.aragon-admin-api-${ENV_SUFFIX:-local}
        required: false
    depends_on:
      - rabbitmq
    command: bash -c "yarn wait:rabbitmq && yarn service:aragon-admin-api"
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:4001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal-net
      - public-net

  service-aragon-indexer:
    image: service-aragon-indexer-${ENV_SUFFIX:-local}
    container_name: service-aragon-indexer-${ENV_SUFFIX:-local}
    build:
      context: .
    env_file:
      - path: .env.aragon-indexer-${ENV_SUFFIX:-local}
        required: false
    depends_on:
      - rabbitmq
    command: bash -c "yarn wait:rabbitmq && yarn service:aragon-indexer"
    healthcheck:
      test: ['CMD-SHELL', "pgrep -f 'service:aragon-indexer' > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal-net
      - public-net

  service-aragon-dao:
    image: service-aragon-dao-${ENV_SUFFIX:-local}
    container_name: service-aragon-dao-${ENV_SUFFIX:-local}
    build:
      context: .
    env_file:
      - path: .env.aragon-dao-${ENV_SUFFIX:-local}
        required: false
    depends_on:
      - rabbitmq
    command: bash -c "yarn wait:rabbitmq && yarn service:aragon-dao"
    healthcheck:
      test: [ 'CMD-SHELL', "pgrep -f 'service:aragon-dao' > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal-net
      - public-net

  service-aragon-transfers:
    image: service-aragon-transfers-${ENV_SUFFIX:-local}
    container_name: service-aragon-transfers-${ENV_SUFFIX:-local}
    build:
      context: .
    env_file:
      - path: .env.aragon-transfers-${ENV_SUFFIX:-local}
        required: false
    depends_on:
      - rabbitmq
    command: bash -c "yarn wait:rabbitmq && yarn service:aragon-transfers"
    healthcheck:
      test: [ 'CMD-SHELL', "pgrep -f 'service:aragon-transfers' > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal-net
      - public-net

  service-aragon-gateway:
    image: service-aragon-gateway-${ENV_SUFFIX:-local}
    container_name: service-aragon-gateway-${ENV_SUFFIX:-local}
    build:
      context: .
    env_file:
      - path: .env.aragon-gateway-${ENV_SUFFIX:-local}
        required: false
    depends_on:
      - rabbitmq
    command: bash -c "yarn wait:rabbitmq && yarn service:aragon-gateway"
    healthcheck:
      test: [ 'CMD-SHELL', "pgrep -f 'service:aragon-gateway' > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal-net
      - public-net

  service-aragon-plugins:
    image: service-aragon-plugins-${ENV_SUFFIX:-local}
    build:
      context: .
    env_file:
      - path: .env.aragon-plugins-${ENV_SUFFIX:-local}
        required: false
    depends_on:
      - rabbitmq
    command: bash -c "yarn wait:rabbitmq && yarn service:aragon-plugins"
    healthcheck:
      test: [ 'CMD-SHELL', "pgrep -f 'service:aragon-plugins' > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal-net
      - public-net
    deploy:
      replicas: 2

  service-aragon-rates:
    image: service-aragon-rates-${ENV_SUFFIX:-local}
    container_name: service-aragon-rates-${ENV_SUFFIX:-local}
    build:
      context: .
    env_file:
      - path: .env.aragon-rates-${ENV_SUFFIX:-local}
        required: false
    depends_on:
      - rabbitmq
    command: bash -c "yarn wait:rabbitmq && yarn service:aragon-rates"
    healthcheck:
      test: [ 'CMD-SHELL', "pgrep -f 'service:aragon-rates' > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal-net
      - public-net

  service-aragon-requeue:
    image: service-aragon-requeue-${ENV_SUFFIX:-local}
    container_name: service-aragon-requeue-${ENV_SUFFIX:-local}
    build:
      context: .
    env_file:
      - path: .env.aragon-requeue-${ENV_SUFFIX:-local}
        required: false
    depends_on:
      - rabbitmq
    command: bash -c "yarn wait:rabbitmq && yarn service:aragon-requeue"
    healthcheck:
      test: [ 'CMD-SHELL', "pgrep -f 'service:aragon-requeue' > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal-net
      - public-net

networks:
  internal-net:
    driver: bridge
  public-net:
    driver: bridge
